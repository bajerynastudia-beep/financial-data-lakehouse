# Databricks Asset Bundle – definicja joba potoku jako kod.
# Wdrożenie (Databricks CLI): databricks bundle deploy && databricks bundle run fin_lakehouse_pipeline
# Alternatywa bez CLI: utwórz job ręcznie w UI według README.md (te same zadania i zależności).
bundle:
  name: financial-data-lakehouse

resources:
  jobs:
    fin_lakehouse_pipeline:
      name: fin-lakehouse-pipeline
      description: "NBP + Stooq + SEC EDGAR -> Bronze -> Silver -> testy jakości -> Gold"
      # Codziennie w dni robocze o 7:30 (po zamknięciu sesji w USA). Wstrzymane, dopóki nie włączycie w UI.
      schedule:
        quartz_cron_expression: "0 30 7 ? * MON-FRI"
        timezone_id: Europe/Warsaw
        pause_status: PAUSED
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: incremental
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py

        - task_key: ingest_nbp
          depends_on: [{task_key: setup}]
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ./notebooks/01_ingest_nbp.py

        - task_key: ingest_stooq
          depends_on: [{task_key: setup}]
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ./notebooks/02_ingest_stooq.py

        - task_key: ingest_sec
          depends_on: [{task_key: setup}]
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ./notebooks/03_ingest_sec.py

        - task_key: silver
          depends_on: [{task_key: ingest_nbp}, {task_key: ingest_stooq}, {task_key: ingest_sec}]
          notebook_task:
            notebook_path: ./notebooks/04_silver.py

        - task_key: quality_silver
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/05_quality_silver.py

        - task_key: gold
          depends_on: [{task_key: quality_silver}]
          notebook_task:
            notebook_path: ./notebooks/06_gold.py

targets:
  dev:
    mode: development
    default: true
