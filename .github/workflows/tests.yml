name: testy

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalacja zależności
        run: pip install -r requirements-dev.txt
      - name: Testy jednostkowe (źródła, konfiguracja, transformacje, reguły jakości)
        run: pytest -v -rs --junitxml=pytest-report.xml
      - name: Kontrola - żaden test (w tym testy PySpark) nie może zostać pominięty
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("pytest-report.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"testy: {tests}, pominięte: {skipped}")
          assert skipped == 0, "Pominięto testy - sprawdź instalację PySpark/Java"
          EOF
